# 推荐调试方式：先把本插件安装到 profile 的依赖里
#   cd <DSH_HOME>/profiles/web && pnpm add file:C:/Users/Funny/WorkBuddy/2026-11-17-09-19-04/dsh-linux-fleet
# 再用：dsh web --patch ./cordis.patch.yml
# 这样 host 半部与 client 半部（设置页）都能加载。
- insert:
    - id: dsh-linux-fleet
      name: dsh-linux-fleet
      config:
        connectTimeout: 15000
        commandTimeout: 30000
        commandMaxBytes: 131072
        preferConfig: false
        servers: []
